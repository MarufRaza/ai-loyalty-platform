version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: loyalty_postgres
    environment:
      POSTGRES_DB: loyaltydb
      POSTGRES_USER: loyalty_user
      POSTGRES_PASSWORD: loyalty_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty_user -d loyaltydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loyalty_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyalty_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loyaltydb
      SPRING_DATASOURCE_USERNAME: loyalty_user
      SPRING_DATASOURCE_PASSWORD: loyalty_secret_2024
      JWT_SECRET: 8Zz5tw3ajx4e7cLCSmtJXoA3sdfsdfDFSDFSDF23423sdfgdfgdfg
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000
      OLLAMA_BASE_URL: http://ollama:11434
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loyalty_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loyalty_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - loyalty_network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: loyalty_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - loyalty_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: loyalty_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - loyalty_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: loyalty_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_admin_2024
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - loyalty_network
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  loyalty_network:
    driver: bridge
