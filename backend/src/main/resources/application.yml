spring:
  application:
    name: loyalty-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/loyaltydb}}
    username: ${SPRING_DATASOURCE_USERNAME:loyalty_user}
    password: ${SPRING_DATASOURCE_PASSWORD:loyalty_secret_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: LoyaltyHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  cache:
    type: simple

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-must-be-at-least-32-chars-long-here}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  token-prefix: "Bearer "
  header: "Authorization"

ai:
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:llama-3.3-70b-versatile}
  timeout: ${AI_TIMEOUT:30}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: "Loyalty Platform API"
    description: "AI-Powered Customer Loyalty & Marketing Automation Platform"
    version: "1.0.0"
    contact:
      name: "Platform Team"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.loyaltyplatform: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/loyalty-platform.log
    max-size: 10MB
    max-history: 30

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  loyalty:
    silver-threshold: 0
    gold-threshold: 1000
    platinum-threshold: 5000
    points-per-dollar: 10
    points-to-dollar-ratio: 0.01
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-duration-seconds: 60
